<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vire</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="vire.css" />
  </head>
  <body>
    <div class="container">
      <h1>Vire</h1>

      <div class="phrase-box">
        <div class="phrase-text" id="phrase"></div>
        <button onclick="newPhrase()" title="Uusi lause">
          <i class="ti ti-refresh"></i> Uusi
        </button>
      </div>

      <div class="nav-row">
        <button onclick="changeDay(-1)">
          <i class="ti ti-chevron-left"></i>
        </button>
        <div class="date-label" id="dateLabel"></div>
        <button onclick="changeDay(1)" id="btnNext">
          <i class="ti ti-chevron-right"></i>
        </button>
        <button class="btn-today" onclick="goToday()">Tänään</button>
      </div>

      <div
        class="history-dots"
        id="historyDots"
        title="Viimeiset 14 päivää joilla on merkintöjä"
      ></div>

      <div class="top-row">
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot" style="background: #e24b4a"></div>
            Ylivireys
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: #639922"></div>
            Optimivireys
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: #378add"></div>
            Alivireys
          </div>
        </div>
        <div style="display: flex; gap: 6px">
          <button
            id="btnLabels"
            onclick="toggleLabels()"
            title="Näytä/piilota tekstitunnisteet"
            style="font-size: 12px; padding: 4px 8px"
          >
            <i class="ti ti-tag"></i>
          </button>
          <button
            onclick="clearDay()"
            title="Tyhjennä päivä"
            style="font-size: 12px; padding: 4px 8px"
          >
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </div>

      <div class="chart-area" id="chartArea">
        <div class="zone zone-yli" onclick="zoneClick(event, 'yli')">
          <span class="zone-label">Ylivireys</span>
        </div>
        <div class="zone zone-opti" onclick="zoneClick(event, 'opti')">
          <span class="zone-label">Optimivireys</span>
        </div>
        <div class="zone zone-ali" onclick="zoneClick(event, 'ali')">
          <span class="zone-label">Alivireys</span>
        </div>
        <div class="dots-layer" id="dotsLayer"></div>
      </div>

      <div class="time-axis">
        <span>6</span><span>8</span><span>10</span><span>12</span><span>14</span
        ><span>16</span><span>18</span><span>20</span><span>22</span>
      </div>

      <div class="add-panel" id="addPanel">
        <label>Kellonaika</label>
        <input
          type="text"
          id="inputTime"
          placeholder="esim. 09:30"
          maxlength="5"
          onkeydown="if (event.key === 'Enter') saveEntry();"
        />
        <label>Syy / huomio</label>
        <input
          type="text"
          id="inputReason"
          placeholder="esim. palaveri stressasi"
          onkeydown="if (event.key === 'Enter') saveEntry();"
        />
        <div class="btn-row">
          <button class="btn-save" onclick="saveEntry()">Lisää</button>
          <button onclick="cancelAdd()">Peruuta</button>
          <span class="save-status" id="saveStatus"></span>
        </div>
      </div>
    </div>

    <div class="tooltip" id="tooltip"></div>
    <script src="vire.js"></script>
  </body>
</html>
